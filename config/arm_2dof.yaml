# =============================================================================
# 2축(모터 1, 2) CyberGear 로봇팔 설정
#   ※ "측정 필요" 표시된 값은 실제 로봇을 재서 바꿀 것
# =============================================================================
arm_controller:
  ros__parameters:
    # ---------------- 통신 ----------------
    transport: "serial"          # serial(CH340 어댑터) | socketcan | sim(하드웨어 없이)
    buses: ["/dev/ttyUSB0"]      # serial: 포트 목록 / socketcan: ["can0", "can1", ...]
    baudrate: 921600
    host_id: 253

    # ---------------- 관절 ----------------
    joint_names:   ["joint1", "joint2"]
    motor_ids:     [1, 2]
    bus_indices:   [0, 0]        # 각 관절이 buses 의 몇 번째에 연결됐는지
    directions:    [1.0, 1.0]    # 모터 +방향이 DH 축과 반대면 -1.0
    offsets:       [0.0, 0.0]    # q_joint = direction * q_motor + offset  [rad]
    torque_limits: [2.0, 2.0]    # [Nm] 처음엔 작게

    # ---------------- 루프 ----------------
    rate_hz: 500.0               # CH340 1개 + 모터 2개: 500 Hz 권장 (1 kHz 는 도전)
    publish_decimation: 5        # 5주기마다 1번 publish (500Hz -> 100Hz)
    reference_timeout: 0.5       # [s] 기준 궤적이 끊기면 마지막 위치에서 정지
    velocity_filter_hz: 0.0      # 속도 저역통과 필터 [Hz], 0 = 끔
    realtime_priority: 80

    # ---------------- 안전 ----------------
    joint_min: [-2.5, -1.8]      # [rad]
    joint_max: [ 2.5,  1.8]
    max_velocity: 6.0            # [rad/s]
    feedback_timeout: 0.05       # [s]
    safe_damping_kd: 1.0         # SAFE 모드에서 모터 내부 댐핑

    # ---------------- SMC ----------------
    smc.use_model: true          # false 면 모델 없이 K, Kd 만 사용 (비교 실험용)
    smc.lambda: [15.0, 15.0]     # [1/s] 오차 수렴 속도
    smc.k:      [0.2, 0.4]       # [Nm]  모델 오차 상한보다 크게
    smc.phi:    [0.3, 0.3]       # [rad/s] 경계층 두께 (채터링 vs 정확도)
    smc.kd:     [0.2, 0.2]       # [Nm/(rad/s)]

    # ---------------- 동역학 모델 ----------------
    model.d2: 0.05               # [m] DH d2               ※ 측정 필요
    model.motor_mass: 0.317      # [kg] CyberGear          ※ 실측 권장
    model.motor_radius: 0.040    # [m]                     ※ 측정 필요
    model.motor_length: 0.042    # [m]                     ※ 측정 필요
    model.motor2_offset: 0.03    # [m] o1 -> 모터2 중심 (z1 방향)  ※ 측정 필요
    model.link1_extra_izz: 0.0   # [kg m^2] 링크1 브래킷 관성
    model.profile_length: 0.20   # [m] 20x20 프로파일 길이 ※ 측정 필요
    model.profile_start: 0.0     # [m] 관절2 축 -> 프로파일 시작
    model.profile_lin_density: 0.45  # [kg/m]             ※ 제품 스펙 확인
    model.profile_side: 0.02     # [m]
    model.bracket2_mass: 0.0     # [kg]
    model.bracket2_pos: 0.0      # [m]
    model.tip_mass: 0.0          # [kg] 끝단 질량
    model.tip_pos: 0.20          # [m]
    model.rotor_reflected1: 0.0  # [kg m^2] 모르면 0
    model.rotor_reflected2: 0.0
    model.viscous1: 0.0          # [Nm s/rad]
    model.viscous2: 0.0
    model.coulomb1: 0.0          # [Nm]
    model.coulomb2: 0.0

    # ---------------- 시뮬레이터 (transport: sim 일 때만) ----------------
    sim.mass_scale: 1.3          # "실제" 로봇을 30% 무겁게 -> 모델 오차 실험
    sim.q0: [0.0, 0.3]           # 초기 자세 [rad]
