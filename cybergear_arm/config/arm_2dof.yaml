# =============================================================================
# 2축 제어기 설정  (동역학 모델은 model_2dof.yaml)
# =============================================================================
arm_controller:
  ros__parameters:
    # ---------------- 통신 ----------------
    transport: "serial"          # serial(CH340) | socketcan | sim
    buses: ["/dev/ttyUSB0"]
    baudrate: 921600
    host_id: 253

    # ---------------- 관절 ----------------
    joint_names:   ["joint1", "joint2"]
    motor_ids:     [1, 2]
    bus_indices:   [0, 0]
    directions:    [1.0, 1.0]    # 모터 +방향이 DH 축과 반대면 -1.0
    offsets:       [0.0, 0.0]    # q_joint = direction * q_motor + offset [rad]
    torque_limits: [2.0, 2.0]    # [Nm] 모터 자체 제한(limit_torque)으로도 설정됨

    # ---------------- 루프 ----------------
    rate_hz: 500.0
    publish_decimation: 5
    reference_timeout: 0.5
    velocity_filter_hz: 0.0      # ※ 채터링 잡으려고 켜지 말 것 (위상 지연 -> 더 떨림)
    realtime_priority: 80

    # ---------------- 안전 ----------------
    joint_min: [-2.5, -1.8]
    joint_max: [ 2.5,  1.8]
    max_velocity: 6.0
    feedback_timeout: 0.05
    safe_damping_kd: 1.0

    # ---------------- SMC ----------------
    smc.inner_loop: "motor"      # motor(권장: 선형 피드백을 모터 내부 PD로) | host(이전 방식)
    smc.use_model: true
    smc.lambda: [10.0, 10.0]     # [1/s]   모터 내부 kp = λ * kd_int
    smc.k:      [0.2, 0.3]       # [Nm]
    smc.phi:    [0.5, 0.5]       # [rad/s] 경계층 (host 모드면 크게)
    smc.kd:     [0.1, 0.1]       # [Nm s/rad]  모터 내부 kd = kd + k/phi
    smc.ki:     [0.0, 0.0]       # [Nm/rad] 조건부 적분 (정상상태 오차 제거용, 튜닝 마지막에)
    smc.i_max:  [0.3, 0.3]       # [Nm] 적분항 최대

    # ---------------- 시뮬레이터 (transport: sim) ----------------
    sim.mass_scale: 1.3
    sim.feedback_delay: 0.004    # [s] USB 지연 흉내
    sim.q0: [0.0, 0.3]
