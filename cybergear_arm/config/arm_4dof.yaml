# =============================================================================
# 4축 제어기 설정  (동역학 모델은 model_4dof.yaml — 예시이므로 실제 값으로 수정!)
#   CH340 어댑터 1개로 4축: 500 Hz 까지 (1 kHz 는 대역폭 부족, ARCHITECTURE.md 6절)
# =============================================================================
arm_controller:
  ros__parameters:
    transport: "serial"
    buses: ["/dev/ttyUSB0"]
    baudrate: 921600
    host_id: 253

    joint_names:   ["joint1", "joint2", "joint3", "joint4"]
    motor_ids:     [1, 2, 3, 4]
    bus_indices:   [0, 0, 0, 0]
    directions:    [1.0, 1.0, 1.0, 1.0]
    offsets:       [0.0, 0.0, 0.0, 0.0]
    torque_limits: [2.0, 3.0, 2.0, 1.0]   # 어깨(joint2)가 가장 큰 중력 토크

    rate_hz: 500.0
    publish_decimation: 5
    reference_timeout: 0.5
    velocity_filter_hz: 0.0
    realtime_priority: 80

    joint_min: [-2.5, -1.8, -2.2, -2.2]
    joint_max: [ 2.5,  1.8,  2.2,  2.2]
    max_velocity: 6.0
    feedback_timeout: 0.05
    safe_damping_kd: 1.0

    smc.inner_loop: "motor"
    smc.use_model: true
    smc.lambda: [10.0, 10.0, 10.0, 10.0]
    smc.k:      [0.2, 0.4, 0.3, 0.1]
    smc.phi:    [0.5, 0.5, 0.5, 0.5]
    smc.kd:     [0.1, 0.1, 0.1, 0.05]
    smc.ki:     [0.0, 0.0, 0.0, 0.0]
    smc.i_max:  [0.3, 0.5, 0.3, 0.2]

    sim.mass_scale: 1.3
    sim.feedback_delay: 0.004
    sim.q0: [0.0, 0.3, 0.3, 0.0]
