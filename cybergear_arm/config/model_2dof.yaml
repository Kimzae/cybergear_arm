# =============================================================================
# 2축 로봇 동역학 모델 (DH + 링크 부품)
#
#   좌표 약속 (표준 DH)
#     - frame 0 = 전역 좌표계, 관절 i 는 z_{i-1} 축을 돈다
#     - "link:" 아래 부품 위치는 frame i (이 관절이 움직이는 링크의 좌표계) 기준
#     - θ_i = q_i + theta_offset
#
#   부품 type
#     cylinder : 원통 (CyberGear 본체)   mass, radius, length, pos(중심), axis(x|y|z)
#     profile  : 사각 프로파일           lin_density[kg/m], side, length, start(시작점), axis(±x|±y|±z)
#     point    : 점질량                   mass, pos
#     custom   : CAD 값 직접 입력          mass, com, inertia[ixx,iyy,izz,ixy,ixz,iyz]
#
#   ※ "측정 필요" 값은 실측해서 바꿀 것
# =============================================================================
gravity: [0.0, 0.0, -9.81]

joints:
  # ---- 관절 1: 전역 z축, 모터 2 본체를 들고 돈다 ----
  - name: joint1
    dh: {theta_offset_deg: 0.0, d: 0.10, a: 0.0, alpha_deg: 90.0}   # d1 ※ 측정 필요
    armature: 0.0        # 회전자 반사 관성 [kg m^2] (모르면 0)
    viscous: 0.0
    coulomb: 0.0
    link:                # frame 1 기준 (z1 = 관절2 축, 수평)
      - {type: cylinder, mass: 0.317, radius: 0.040, length: 0.042, pos: [0.0, 0.0, 0.03], axis: z}  # 모터2 ※ 측정 필요

  # ---- 관절 2: 수평축, q2=0 에서 링크가 위(전역 z)를 향함 ----
  - name: joint2
    dh: {theta_offset_deg: 90.0, d: 0.05, a: 0.0, alpha_deg: 0.0}   # d2 ※ 측정 필요
    armature: 0.0
    viscous: 0.0
    coulomb: 0.0
    link:                # frame 2 기준 (x2 = 링크 방향)
      - {type: profile, lin_density: 0.45, side: 0.02, length: 0.20, start: [0.0, 0.0, 0.0], axis: x}  # ※ 측정 필요
      # - {type: point, mass: 0.05, pos: [0.20, 0.0, 0.0]}   # 끝단 질량이 있으면
